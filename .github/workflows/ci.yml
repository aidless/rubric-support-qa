name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install test dependencies (pinned)
        run: python3 -m pip install -r requirements.txt
      - name: unit tests
        run: python3 -m unittest discover -s tests -v
      - name: rubric lint
        run: python3 rubric/lint.py
      - name: requirements check
        run: python3 scripts/check_requirements.py
      - name: dev set freeze check
        run: python3 scripts/freeze.py --check
      - name: test set freeze check
        run: python3 scripts/freeze_test.py --check
